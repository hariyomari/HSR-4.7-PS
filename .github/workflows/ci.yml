name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  verify:
    name: Build and regressions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # PR checkouts use the merge commit; its first parent is the base branch.
          fetch-depth: 2
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Check the language of new comments
        if: github.event_name == 'pull_request'
        run: python3 scripts/check-comments.py --base HEAD^1
      # NuGet audit findings stay warnings: an advisory published later must not fail unrelated changes.
      - name: Build with warnings as errors
        run: >-
          dotnet build March7thHoney.sln -c Release
          -warnaserror "-warnnotaserror:NU1901;NU1902;NU1903;NU1904"
      # Suites needing private game resources report SKIP here and run locally.
      - name: Run the resource-independent regressions
        run: python3 scripts/verify-security.py --skip-build

  publish:
    name: Publish ${{ matrix.rid }}
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        rid: [win-x64, linux-x64, linux-arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Publish a self-contained build
        run: dotnet publish Program/Program.csproj -c Release -r ${{ matrix.rid }} --self-contained true -o publish
      - uses: actions/upload-artifact@v7
        with:
          name: March7thHoney-${{ matrix.rid }}
          path: publish
          if-no-files-found: error
