syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "Common.proto";

enum CmdGachaType {
	CmdGachaType_NLCDGIPGFDJ = 0;
	CmdGachaType_GetGachaCeilingCsReq = 1905;
	CmdGachaType_SetGachaDecideItemCsReq = 1906;
	CmdGachaType_ExchangeGachaCeilingScRsp = 1918;
	CmdGachaType_GetGachaInfoScRsp = 1919;
	CmdGachaType_PDCIIFCCBEH = 1927;
	CmdGachaType_DoGachaCsReq = 1931;
	CmdGachaType_ExchangeGachaCeilingCsReq = 1959;
	CmdGachaType_SetGachaDecideItemScRsp = 1970;
	CmdGachaType_GetGachaCeilingScRsp = 1971;
	CmdGachaType_GetGachaInfoCsReq = 1974;
	CmdGachaType_DoGachaScRsp = 1987;
}

message DoGachaCsReq {
	uint32 gacha_id = 4;
	uint32 gacha_random = 8;
	uint32 simulate_magic = 12;
	uint32 gacha_num = 15;
}

message DoGachaScRsp {
	uint32 retcode = 1;
	repeated GachaItem gacha_item_list = 2;
	uint32 GPNLDDLBOLM = 3;
	uint32 NHBBHEMPJJM = 5;
	uint32 gacha_num = 6;
	uint32 LDBCKJIPDHF = 9;
	uint32 NCBEDGBOJLC = 10;
	uint32 newbie_pull_count = 12;
	uint32 gacha_id = 13;
}

message ExchangeGachaCeilingCsReq {
	uint32 gacha_type = 1;
	uint32 avatar_id = 5;
}

message ExchangeGachaCeilingScRsp {
	ItemList transfer_item_list = 1;
	uint32 avatar_id = 6;
	GachaCeiling gacha_ceiling = 8;
	uint32 gacha_type = 12;
	uint32 retcode = 14;
}

message GachaCeiling {
	bool is_claimed = 5;
	repeated GachaCeilingAvatar avatar_list = 11;
	uint32 ceiling_num = 13;
}

message GachaCeilingAvatar {
	uint32 repeated_cnt = 11;
	uint32 avatar_id = 12;
}

message GachaInfo {
	int64 end_time = 1;
	uint32 gacha_id = 2;
	GachaCeiling gacha_ceiling = 3;
	uint32 MMELNCHIDNC = 4;
	int64 begin_time = 5;
	uint32 NHBBHEMPJJM = 6;
	string detail_url = 9;
	repeated uint32 prize_item_list = 10;
	repeated uint32 item_detail_list = 11;
	repeated uint32 ONIHOMCELJK = 13;
	string history_url = 14;
	uint32 newbie_pull_count = 15;
}

message GachaItem {
	ItemList transfer_item_list = 5;
	bool is_new = 7;
	ItemList token_item = 10;
	Item gacha_item = 15;
}

message GetGachaCeilingCsReq {
	uint32 DDMCNOJFGON = 8;
}

message GetGachaCeilingScRsp {
	uint32 gacha_type = 1;
	GachaCeiling gacha_ceiling = 8;
	uint32 retcode = 9;
}

message GetGachaInfoCsReq {
}

message GetGachaInfoScRsp {
	uint32 retcode = 1;
	uint32 gacha_random = 7;
	uint32 KKKNJDBNJPM = 8;
	uint32 OGMPKDHKPAJ = 10;
	repeated NEIMLKNMDBM AKMDBPNEHDE = 11;
	uint32 GPNLDDLBOLM = 14;
	repeated GachaInfo gacha_info_list = 15;
}

message NEIMLKNMDBM {
	repeated uint32 OJNEFBJHCCK = 3;
	uint32 GFANBHAEKOK = 10;
	repeated uint32 EJGNMCAMELA = 12;
	uint32 MMELNCHIDNC = 13;
}

message SetGachaDecideItemCsReq {
	uint32 GFANBHAEKOK = 8;
	repeated uint32 OJNEFBJHCCK = 12;
	uint32 gacha_id = 15;
}

message SetGachaDecideItemScRsp {
	uint32 retcode = 4;
	NEIMLKNMDBM NBLOJLDLBEB = 15;
}
