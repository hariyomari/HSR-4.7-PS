syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "Common.proto";

enum CmdTutorialType {
	CmdTutorialType_NLCDGIPGFDJ = 0;
	CmdTutorialType_UnlockTutorialCsReq = 1605;
	CmdTutorialType_FinishTutorialCsReq = 1606;
	CmdTutorialType_UnlockTutorialGuideScRsp = 1618;
	CmdTutorialType_GetTutorialScRsp = 1619;
	CmdTutorialType_FinishTutorialGuideCsReq = 1627;
	CmdTutorialType_GetTutorialGuideCsReq = 1631;
	CmdTutorialType_FinishTutorialGuideScRsp = 1652;
	CmdTutorialType_UnlockTutorialGuideCsReq = 1659;
	CmdTutorialType_FinishTutorialScRsp = 1670;
	CmdTutorialType_UnlockTutorialScRsp = 1671;
	CmdTutorialType_GetTutorialCsReq = 1674;
	CmdTutorialType_GetTutorialGuideScRsp = 1687;
}

message FinishTutorialCsReq {
	uint32 tutorial_id = 8;
	TutorialFinishType HFIBLHAFONM = 12;
}

message FinishTutorialGuideCsReq {
	TutorialGuideType type = 4;
	uint32 group_id = 6;
}

message FinishTutorialGuideScRsp {
	uint32 retcode = 13;
	ItemList reward = 14;
	TutorialGuide tutorial_guide = 15;
}

message FinishTutorialScRsp {
	Tutorial tutorial = 1;
	uint32 retcode = 7;
}

message GetTutorialCsReq {
}

message GetTutorialGuideCsReq {
}

message GetTutorialGuideScRsp {
	repeated TutorialGuide tutorial_guide_list = 8;
	uint32 retcode = 15;
}

message GetTutorialScRsp {
	repeated Tutorial tutorial_list = 3;
	uint32 retcode = 9;
}

message Tutorial {
	TutorialStatus status = 9;
	uint32 id = 15;
}

enum TutorialFinishType {
	TutorialFinishType_NLCDGIPGFDJ = 0;
	TutorialFinishType_CNPNACJBHJG = 1;
	TutorialFinishType_NNAIDJINDHO = 2;
}

message TutorialGuide {
	TutorialStatus status = 9;
	uint32 id = 10;
	TutorialGuideType type = 15;
}

enum TutorialGuideType {
	TutorialGuideType_TutorialGuideDefault = 0;
	TutorialGuideType_TutorialGuideSubguide = 1;
}

enum TutorialStatus {
	TutorialStatus_TutorialNone = 0;
	TutorialStatus_TutorialUnlock = 1;
	TutorialStatus_TutorialFinish = 2;
}

message UnlockTutorialCsReq {
	uint32 tutorial_id = 3;
}

message UnlockTutorialGuideCsReq {
	uint32 group_id = 5;
	TutorialGuideType type = 13;
}

message UnlockTutorialGuideScRsp {
	uint32 retcode = 11;
	TutorialGuide tutorial_guide = 13;
}

message UnlockTutorialScRsp {
	Tutorial tutorial = 2;
	uint32 retcode = 5;
}
